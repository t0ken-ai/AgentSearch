[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-search"
dynamic = ["version"]
description = "AgentSearch — local stealth-browser web search across 100+ sites for AI agents. No API keys, no third-party servers."
requires-python = ">=3.12"
dependencies = [
    "cloakbrowser>=0.3.31",
    "trafilatura>=2.0",
    "pdfplumber>=0.11",
    "requests>=2.30",
    "certifi>=2024.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]

[project.scripts]
agentsearch = "agent_search.cli:main"

[tool.setuptools.packages.find]
include = ["agent_search*"]

[tool.setuptools.dynamic]
# Keep package metadata and ``agent_search.__version__`` on one source of
# truth so CLI/HTTP headers and built distributions cannot drift apart.
version = {attr = "agent_search.__version__"}
